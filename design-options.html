<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reading Platform — 5 aesthetic directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0b0b; color: #ddd; font-family: Inter, system-ui, sans-serif; padding: 40px 0 80px; }
  .doc-title { width: 1280px; margin: 0 auto 30px; font-size: 15px; color: #888; }
  .doc-title h1 { color: #fff; font-size: 28px; margin: 0 0 6px; }

  /* ================= Board scaffold ================= */
  .board {
    width: 1280px; margin: 0 auto 70px; padding: 0 0 36px; border-radius: 26px; overflow: hidden;
    background: var(--bg); color: var(--text); font-family: var(--font-ui);
  }
  .board-label {
    display: flex; align-items: baseline; gap: 14px; padding: 18px 40px; background: #000; color: #fff;
    font-family: Inter, sans-serif; border-bottom: 1px solid #222;
  }
  .board-label b { font-size: 20px; }
  .board-label span { color: #999; font-size: 14.5px; }
  .board-label .num { background: #fff; color: #000; border-radius: 8px; padding: 2px 9px; font-weight: 800; font-size: 15px; }

  .hdr { display: flex; align-items: center; justify-content: space-between; padding: 18px 40px; border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; font-family: var(--font-display); }
  .brand-mark { width: 34px; height: 34px; border-radius: var(--mark-radius, 10px); background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; font-family: var(--font-ui); font-size: 15px; }
  .nav { display: flex; align-items: center; gap: 26px; font-size: 15px; color: var(--muted); font-weight: 500; }
  .nav .on { color: var(--text); }
  .acct { display: flex; align-items: center; gap: 8px; color: var(--text); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--avatar, #6c8cff); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
  .modebtn { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; border: 1px solid var(--border); color: var(--muted); }

  .hero { padding: 44px 40px 34px; display: flex; justify-content: space-between; align-items: flex-end; }
  .eyebrow { font-size: 13px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
  .hello { font-family: var(--font-display); font-size: 52px; font-weight: var(--display-weight, 700); line-height: 1.05; letter-spacing: var(--display-track, -0.5px); margin: 0; }
  .sub { color: var(--muted); font-size: 17px; margin: 10px 0 0; }
  .stats-mini { display: flex; gap: 10px; }
  .pill { padding: 9px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 14px; color: var(--muted); }
  .pill b { color: var(--text); }

  .btn {
    display: inline-flex; align-items: center; gap: 10px; border: 0; font-family: var(--font-ui);
    background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 17px;
    padding: 15px 24px; border-radius: var(--btn-radius); box-shadow: var(--btn-shadow);
  }
  .btn.green { background: var(--success); color: var(--success-ink, #fff); box-shadow: var(--btn-shadow-green); }

  .lib-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 40px 18px; }
  .lib-head h2 { font-family: var(--font-display); font-size: 26px; margin: 0; font-weight: var(--display-weight, 700); }
  .filters { display: flex; gap: 8px; }
  .filters span { font-size: 13.5px; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .filters span.on { background: var(--text); color: var(--bg); border-color: var(--text); }

  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 26px; padding: 0 40px 40px; }
  .card { position: relative; }
  .cover { position: relative; aspect-ratio: 3/4; overflow: hidden; border-radius: var(--cover-radius); border: var(--cover-border); box-shadow: var(--cover-shadow); background: #333; }
  .cover svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .meta { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 12px 4px 0; }
  .title { font-weight: 600; font-size: 16.5px; line-height: 1.25; font-family: var(--font-title, var(--font-ui)); }
  .age { margin-top: 4px; font-size: 13px; color: var(--muted); }
  .age b { color: var(--text); font-weight: 600; }
  .ring { flex: none; transform: rotate(-90deg); }
  .ring .bg { stroke: var(--surface-2); }
  .ring .fg { stroke: var(--accent); }
  .check { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--success); color: var(--success-ink, #fff); display: grid; place-items: center; }

  /* ================= Reader + quiz frames ================= */
  .frames { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; padding: 0 40px; }
  .frame-cap { font-size: 12px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
  .screen { height: 400px; border-radius: 18px; border: 1px solid var(--border); background: var(--reader-bg, var(--bg)); display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .r-top { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; }
  .r-left { display: flex; gap: 12px; align-items: center; }
  .sq { width: 44px; height: 44px; border-radius: var(--sq-radius, 12px); background: var(--surface-2); display: grid; place-items: center; color: var(--text); box-shadow: var(--sq-shadow); }
  .wpm small { display: block; font-size: 10px; color: var(--muted); font-weight: 700; letter-spacing: .5px; }
  .wpm b { font-size: 16px; }
  .r-right { display: flex; gap: 10px; align-items: center; text-align: right; font-size: 13px; line-height: 1.25; }
  .r-right small { display: block; font-size: 11.5px; color: var(--muted); }
  .mini { width: 34px; height: 44px; border-radius: 7px; overflow: hidden; position: relative; border: var(--mini-border, 2px solid var(--surface-2)); }
  .mini svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .r-stage { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 30px; overflow: hidden; }
  .sent { width: 100%; max-width: 380px; font-family: var(--font-read); font-weight: var(--read-weight, 700); font-size: 22px; line-height: 1.32; padding: 7px 12px; border-radius: 12px; margin: 2px 0; }
  .sent.read { opacity: .72; }
  .sent.cur { background: var(--current-bg, var(--surface)); box-shadow: var(--current-shadow, none); }
  .sent.up { filter: blur(5px); opacity: .3; }
  .r-bottom { display: flex; justify-content: center; gap: 14px; padding: 14px; border-top: 1px solid var(--border); }
  .r-bottom .sq { width: 56px; height: 50px; }
  .r-bottom .btn { width: 300px; justify-content: space-between; height: 50px; }

  .q { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 30px; position: relative; }
  .q-label { font-size: 11px; letter-spacing: 1.4px; color: var(--accent); font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
  .q h3 { font-family: var(--font-display); font-size: 22px; margin: 0 0 16px; text-align: center; font-weight: var(--display-weight, 700); }
  .opt { width: 100%; max-width: 380px; display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--opt-radius, 12px); border: 2px solid var(--surface-2); background: var(--surface); margin-bottom: 8px; font-weight: 600; font-size: 15px; }
  .opt .k { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--surface-2); display: grid; place-items: center; font-size: 11px; color: var(--muted); }
  .opt.ok { border-color: var(--success); background: color-mix(in srgb, var(--success) 14%, var(--surface)); }
  .opt.ok .k { border-color: var(--success); color: var(--success); }
  .correct-big { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--reader-bg, var(--bg)) 45%, transparent); }
  .correct-big span { font-family: var(--font-display); font-size: 64px; font-weight: 800; color: var(--success); text-shadow: var(--correct-shadow); transform: rotate(var(--correct-rot, 0deg)); }
  .fb { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; background: color-mix(in srgb, var(--success) 16%, var(--reader-bg, var(--bg))); }
  .fb b { color: var(--success); font-size: 20px; font-family: var(--font-display); display: block; }
  .fb small { font-size: 13px; }
  .fb .btn { width: 200px; justify-content: space-between; height: 48px; }

  /* =================================================================
     1 — NIGHT SHELF  (closest to Little Readings)
     ================================================================= */
  .o1 {
    --bg: #151515; --surface: #222; --surface-2: #363636; --border: #262626; --text: #f4f4f4; --muted: #8b8b8b;
    --accent: #ff9a25; --accent-ink: #fff; --success: #58cc02;
    --font-ui: Poppins, sans-serif; --font-display: Poppins, sans-serif; --font-read: Poppins, sans-serif;
    --btn-radius: 14px; --btn-shadow: 0 5px 0 #c46c0a; --btn-shadow-green: 0 5px 0 #46a302;
    --cover-radius: 18px; --cover-border: 3px solid #393939; --cover-shadow: none;
    --sq-shadow: 0 4px 0 #0c0c0c; --correct-shadow: 0 5px 0 #46a302;
  }
  .o1 .card.hl .cover { border-color: #f4f4f4; }

  /* =================================================================
     2 — STORYBOOK  (warm, serif, feels like a printed book)
     ================================================================= */
  .o2 {
    --bg: #1c1612; --surface: #29211b; --surface-2: #3f342b; --border: #33291f; --text: #f3e8d6; --muted: #a8967e;
    --accent: #e27a4e; --accent-ink: #fff; --success: #8cbf6d; --avatar: #b5835a;
    --font-ui: Inter, sans-serif; --font-display: Lora, serif; --font-read: Lora, serif; --font-title: Lora, serif;
    --display-weight: 600; --display-track: 0; --read-weight: 600;
    --btn-radius: 10px; --btn-shadow: 0 4px 0 #a4532f; --btn-shadow-green: 0 4px 0 #5f8c46;
    --cover-radius: 4px 10px 10px 4px; --cover-border: 0; --cover-shadow: -6px 0 0 -2px #3f342b, 0 14px 22px -10px rgba(0,0,0,.7);
    --mark-radius: 50%; --sq-shadow: 0 3px 0 #110d0a; --correct-shadow: none; --correct-rot: -4deg;
    --current-bg: transparent; --current-shadow: inset 4px 0 0 var(--accent);
  }
  .o2 .hello { font-style: italic; }
  .o2 .cover::before { content: ""; position: absolute; z-index: 2; inset: 0; box-shadow: inset 0 0 0 7px rgba(243,232,214,.92); border-radius: inherit; }
  .o2 .cover::after { content: ""; position: absolute; z-index: 2; left: 0; top: 0; bottom: 0; width: 8px; background: linear-gradient(90deg, rgba(0,0,0,.25), transparent); }
  .o2 .title { font-size: 18px; font-weight: 600; }
  .o2 .sent.cur { border-radius: 0 10px 10px 0; background: color-mix(in srgb, var(--accent) 9%, transparent); }
  .o2 .eyebrow { font-family: Lora, serif; font-style: italic; text-transform: none; letter-spacing: 0; font-size: 18px; font-weight: 500; }

  /* =================================================================
     3 — AURORA  (cool night sky, soft glows, calm)
     ================================================================= */
  .o3 {
    --bg: #0e1328; --surface: #182042; --surface-2: #273163; --border: #222b52; --text: #eef1ff; --muted: #8f97c4;
    --accent: #5fe3b6; --accent-ink: #082319; --success: #5fe3b6; --success-ink: #082319; --avatar: #a78bfa;
    --font-ui: Poppins, sans-serif; --font-display: Poppins, sans-serif; --font-read: Poppins, sans-serif;
    --display-weight: 600; --read-weight: 600;
    --btn-radius: 999px; --btn-shadow: 0 0 0 4px rgba(95,227,182,.15), 0 10px 26px -8px rgba(95,227,182,.6); --btn-shadow-green: var(--btn-shadow);
    --cover-radius: 24px; --cover-border: 0; --cover-shadow: 0 22px 40px -18px rgba(120,140,255,.55);
    --sq-radius: 50%; --sq-shadow: none; --correct-shadow: 0 0 30px rgba(95,227,182,.7);
    --current-bg: rgba(255,255,255,.06); --opt-radius: 16px; --mark-radius: 50%; --mini-border: 0;
  }
  .o3.board { background: radial-gradient(900px 420px at 80% -10%, rgba(167,139,250,.28), transparent 60%), radial-gradient(700px 400px at 0% 10%, rgba(95,227,182,.14), transparent 60%), var(--bg); }
  .o3 .screen { background: radial-gradient(500px 220px at 50% -20%, rgba(167,139,250,.2), transparent 70%), var(--bg); }
  .o3 .hello span { background: linear-gradient(90deg, #5fe3b6, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .o3 .ring .fg { stroke: #a78bfa; }

  /* =================================================================
     4 — POP  (bold, playful, comic-book borders)
     ================================================================= */
  .o4 {
    --bg: #131313; --surface: #1f1f1f; --surface-2: #3a3a3a; --border: #2a2a2a; --text: #fff; --muted: #9a9a9a;
    --accent: #ffd23f; --accent-ink: #131313; --success: #3ddc84; --success-ink: #131313; --avatar: #ff6b8b;
    --font-ui: Poppins, sans-serif; --font-display: Poppins, sans-serif; --font-read: Poppins, sans-serif;
    --display-weight: 800; --display-track: -1px;
    --btn-radius: 12px; --btn-shadow: 4px 4px 0 #fff; --btn-shadow-green: 4px 4px 0 #fff;
    --cover-radius: 14px; --cover-border: 3px solid #fff; --cover-shadow: 7px 7px 0 var(--c);
    --sq-shadow: 3px 3px 0 #fff; --correct-shadow: 5px 5px 0 #131313, 8px 8px 0 #fff; --correct-rot: -6deg; --opt-radius: 10px;
    --mark-radius: 10px;
  }
  .o4 .btn, .o4 .sq { border: 2.5px solid #fff; }
  .o4 .card:nth-child(odd) { transform: rotate(-1.6deg); }
  .o4 .card:nth-child(even) { transform: rotate(1.4deg); }
  .o4 .title { font-weight: 800; font-size: 17px; }
  .o4 .age { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--c); color: #131313; font-weight: 700; }
  .o4 .age b { color: #131313; }
  .o4 .hello span { background: var(--accent); color: #131313; padding: 0 12px; border-radius: 12px; display: inline-block; transform: rotate(-2deg); }
  .o4 .sent.cur { border: 2.5px solid #fff; background: var(--surface); }
  .o4 .opt { border-width: 2.5px; }
  .o4 .opt.ok { border-color: var(--success); box-shadow: 3px 3px 0 var(--success); }
  .o4 .filters span.on { background: var(--accent); border-color: var(--accent); }

  /* =================================================================
     5 — STUDIO  (minimal, editorial, for older students)
     ================================================================= */
  .o5 {
    --bg: #0a0a0a; --surface: #141414; --surface-2: #2a2a2a; --border: #222; --text: #f5f5f5; --muted: #767676;
    --accent: #c8f031; --accent-ink: #0a0a0a; --success: #c8f031; --success-ink: #0a0a0a; --avatar: #333;
    --font-ui: Inter, sans-serif; --font-display: "Inter Display", Inter, sans-serif; --font-read: Inter, sans-serif;
    --display-weight: 700; --display-track: -2.5px; --read-weight: 600;
    --btn-radius: 6px; --btn-shadow: none; --btn-shadow-green: none;
    --cover-radius: 4px; --cover-border: 0; --cover-shadow: none;
    --sq-radius: 6px; --sq-shadow: none; --correct-shadow: none; --opt-radius: 6px; --mark-radius: 4px;
    --current-bg: transparent;
  }
  .o5 .hello { font-size: 76px; }
  .o5 .eyebrow { color: var(--muted); font-weight: 500; letter-spacing: 2.4px; font-size: 12px; }
  .o5 .grid { gap: 0; border-top: 1px solid var(--border); margin: 0 40px 40px; padding: 0; }
  .o5 .card { padding: 22px 18px 20px; border-right: 1px solid var(--border); }
  .o5 .card:last-child { border-right: 0; }
  .o5 .title { font-weight: 600; letter-spacing: -0.2px; }
  .o5 .age { text-transform: uppercase; letter-spacing: 1.6px; font-size: 11px; }
  .o5 .num-idx { font-size: 11px; color: var(--muted); letter-spacing: 1.6px; margin-bottom: 12px; display: block; }
  .o5 .sent { letter-spacing: -0.4px; }
  .o5 .sent.cur { color: var(--text); }
  .o5 .sent.cur::before { content: ""; display: block; width: 26px; height: 3px; background: var(--accent); margin-bottom: 8px; }
  .o5 .sent.read { opacity: .45; }
  .o5 .correct-big span { letter-spacing: -3px; font-size: 76px; }
  .o5 .lib-head h2 { letter-spacing: -1px; }
  .o5 .r-bottom .btn { font-weight: 600; }
</style>
</head>
<body>
<div class="doc-title"><h1>Reading Platform — 5 aesthetic directions</h1>Same content, five looks. Library, reader and quiz feedback for each.</div>
<div id="boards"></div>

<script src="js/data.js"></script>
<script src="js/covers.js"></script>
<script>
const OPTIONS = [
  { cls: "o1", name: "Night Shelf", desc: "Closest to Little Readings: charcoal, orange, thick-framed covers, chunky Duolingo buttons." },
  { cls: "o2", name: "Storybook", desc: "Warm brown night, serif type like a printed book, covers with a cream border and spine." },
  { cls: "o3", name: "Aurora", desc: "Deep navy with soft mint/lilac glows, rounded pills, calm bedtime-reading mood." },
  { cls: "o4", name: "Pop", desc: "Bold and playful: white comic borders, coloured offset shadows, tilted cards." },
  { cls: "o5", name: "Studio", desc: "Minimal editorial: huge tight type, lime accent, flat. Feels grown-up, for teens/adults." },
];
const books = BOOKS.slice(0, 5);
const IC = {
  pause: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="2"/><rect x="14" y="4" width="4" height="16" rx="2"/></svg>',
  right: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>',
  left: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>',
  play: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>',
  check: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  sun: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  down: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 9l6 6 6-6"/></svg>',
};
const ring = (pct) => { const C = 2 * Math.PI * 9; return `<svg class="ring" width="24" height="24" viewBox="0 0 24 24"><circle class="bg" cx="12" cy="12" r="9" fill="none" stroke-width="3.5"/><circle class="fg" cx="12" cy="12" r="9" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg>`; };
const ageTxt = (a) => a.replace("Ages ", "").replace("–", "-");

function board(o, n) {
  const sw = BOOKS[0];
  const cards = books.map((b, i) => `
    <div class="card ${i === 1 && o.cls === 'o1' ? 'hl' : ''}" style="--c:${b.coverColor}">
      ${o.cls === 'o5' ? `<span class="num-idx">0${i + 1}</span>` : ''}
      <div class="cover">${coverSVG(b.id)}</div>
      <div class="meta">
        <div><div class="title">${b.title}</div><div class="age">${o.cls === 'o4' ? '' : 'Age: '}<b>${ageTxt(b.ageRange)}</b></div></div>
        ${i === 0 ? ring(0.35) : i === 1 ? `<span class="check">${IC.check}</span>` : ''}
      </div>
    </div>`).join("");

  return `<section class="board ${o.cls}">
    <div class="board-label"><span class="num">${n}</span><b>${o.name}</b><span>${o.desc}</span></div>
    <div class="hdr">
      <div class="brand"><span class="brand-mark">R</span>Reading Platform</div>
      <div class="nav"><span class="on">Library</span><span>Stats</span><span class="modebtn">${IC.sun}</span><span class="acct"><span class="avatar">S</span>Account ${IC.down}</span></div>
    </div>
    <div class="hero">
      <div>
        <div class="eyebrow">Welcome back</div>
        <h1 class="hello">Hi, <span>Student</span></h1>
        <p class="sub">Pick a story and read at your own pace.</p>
        <div style="margin-top:22px"><button class="btn">${IC.play} Continue · Snow White</button></div>
      </div>
      <div class="stats-mini"><span class="pill"><b>3</b> day streak</span><span class="pill"><b>142</b> avg WPM</span></div>
    </div>
    <div class="lib-head"><h2>Library</h2><div class="filters"><span class="on">All</span><span>Ages 4-6</span><span>Ages 6-9</span><span>Ages 9+</span></div></div>
    <div class="grid">${cards}</div>
    <div class="frames">
      <div>
        <div class="frame-cap">Reader</div>
        <div class="screen">
          <div class="r-top">
            <div class="r-left"><span class="sq">${IC.pause}</span><span class="wpm"><small>WPM</small><b>128</b></span></div>
            <div class="r-right"><div><b>Snow White</b><small>1. The Beautiful Queen</small></div><span class="mini">${coverSVG(sw.id)}</span></div>
          </div>
          <div class="r-stage">
            <p class="sent read">Once upon a time, there lived a kind queen.</p>
            <p class="sent cur">She had skin as white as snow.</p>
            <p class="sent up">Her lips were red as cherries.</p>
          </div>
          <div class="r-bottom"><span class="sq">${IC.left}</span><button class="btn"><span>Next</span>${IC.right}</button></div>
        </div>
      </div>
      <div>
        <div class="frame-cap">Quiz — correct answer</div>
        <div class="screen">
          <div class="q">
            <div class="q-label">Quick check</div>
            <h3>What did the queen name her daughter?</h3>
            <div class="opt"><span class="k">1</span>Rose Red</div>
            <div class="opt ok"><span class="k">2</span>Snow White</div>
            <div class="opt"><span class="k">3</span>Little Cherry</div>
            <div class="correct-big"><span>Correct!</span></div>
          </div>
          <div class="fb"><div><b>Correct!</b><small>Great reading!</small></div><button class="btn green"><span>Continue</span>${IC.right}</button></div>
        </div>
      </div>
    </div>
  </section>`;
}
document.getElementById("boards").innerHTML = OPTIONS.map((o, i) => board(o, i + 1)).join("");
</script>
</body>
</html>
